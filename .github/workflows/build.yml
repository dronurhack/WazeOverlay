name: Build WazeOverlay APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Gradle wrapper
        run: |
          mkdir -p gradle/wrapper
          # Download gradle-wrapper.jar from official Gradle services
          curl -fsSL \
            "https://services.gradle.org/distributions/gradle-8.2-bin.zip" \
            -o /tmp/gradle.zip
          unzip -p /tmp/gradle.zip "gradle-8.2/lib/plugins/gradle-wrapper-*.jar" \
            > gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true
          # Fallback: use gradle init to generate the wrapper
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Fallback: downloading wrapper jar via gradle init"
            wget -q https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar \
              -O gradle/wrapper/gradle-wrapper.jar || true
          fi
          # Nuclear fallback: install gradle system-wide and generate wrapper
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            sudo apt-get install -y gradle -q
            gradle wrapper --gradle-version 8.2 --no-daemon
          fi
          echo "Wrapper jar size: $(wc -c < gradle/wrapper/gradle-wrapper.jar) bytes"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WazeOverlay-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
